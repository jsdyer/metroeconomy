name: Refresh monthly Labour Force Survey
on:
  push:
    branches: [main]
    paths: [scripts/collect.py, scripts/public_download.py, .github/workflows/refresh.yml]
  schedule:
    - cron: '17 15 * * 5'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: refresh-labour-series
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 scripts/collect.py
      - run: python3 scripts/build.py
      - name: Save and publish a changed snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add web/data
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh Canadian metro labour estimates'
            git push origin HEAD:main
          fi
          # A previous dispatch may have failed after its snapshot commit.
          # Build the current branch on every successful check.
          gh workflow run pages.yml --ref main
